name: Build Sound Crate for Mac
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'desktop/**', 'package.json', 'package-lock.json', 'tests/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run test:recording
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify microphone permission description
        run: |
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "dist/mac/Sound Crate.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "dist/mac-arm64/Sound Crate.app/Contents/Info.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: Sound-Crate-Mac
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 30
